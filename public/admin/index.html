<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | qyrn.sh</title>
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var fieldsFR = [
        { label: "Titre", name: "title", widget: "string" },
        { label: "Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9-]+$", "Minuscules, chiffres et tirets uniquement"] },
        { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
        { label: "Langue", name: "lang", widget: "hidden", default: "fr" },
        { label: "Slug de traduction", name: "translationSlug", widget: "string", required: false, hint: "Slug commun pour lier FR/EN" },
        { label: "Type", name: "type", widget: "select", options: [
          { label: "Writeup", value: "writeup" },
          { label: "Tutoriel", value: "tutorial" },
          { label: "Journal", value: "journal" },
          { label: "Veille", value: "watch" },
          { label: "Incident", value: "incident" }
        ]},
        { label: "Catégorie", name: "category", widget: "select", options: ["Web","Network","Privesc","OSINT","Forensics","Crypto","RE","Misc"] },
        { label: "Difficulté", name: "difficulty", widget: "select", options: ["Easy","Medium","Hard"] },
        { label: "Tags", name: "tags", widget: "list", allow_add: true, field: { label: "Tag", name: "tag", widget: "string" } },
        { label: "Plateforme", name: "platform", widget: "string", required: false, hint: "Ex: Hack The Box, TryHackMe" },
        { label: "Résumé", name: "excerpt", widget: "text" },
        { label: "Publié", name: "published", widget: "boolean", default: true },
        { label: "Contenu", name: "body", widget: "markdown", default: "## Contexte\n\nPourquoi j'ai fait ça. Quel problème, quel challenge, quel outil.\n\n## Ce que j'ai fait\n\nLes étapes concrètes. Commandes, screenshots, config.\n\n```bash\n# commandes ici\n```\n\n## Ce que j'ai appris\n\nLe takeaway. Ce qui m'a surpris, ce que je ne savais pas avant.\n\n## Ressources\n\n- [Lien 1](url)\n- [Lien 2](url)" }
      ];
      var fieldsEN = [
        { label: "Title", name: "title", widget: "string" },
        { label: "Slug", name: "slug", widget: "string", pattern: ["^[a-z0-9-]+$", "Lowercase, digits and hyphens only"] },
        { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false },
        { label: "Language", name: "lang", widget: "hidden", default: "en" },
        { label: "Translation slug", name: "translationSlug", widget: "string", required: false, hint: "Shared slug to link FR/EN" },
        { label: "Type", name: "type", widget: "select", options: [
          { label: "Writeup", value: "writeup" },
          { label: "Tutorial", value: "tutorial" },
          { label: "Journal", value: "journal" },
          { label: "Watch", value: "watch" },
          { label: "Incident", value: "incident" }
        ]},
        { label: "Category", name: "category", widget: "select", options: ["Web","Network","Privesc","OSINT","Forensics","Crypto","RE","Misc"] },
        { label: "Difficulty", name: "difficulty", widget: "select", options: ["Easy","Medium","Hard"] },
        { label: "Tags", name: "tags", widget: "list", allow_add: true, field: { label: "Tag", name: "tag", widget: "string" } },
        { label: "Platform", name: "platform", widget: "string", required: false, hint: "E.g. Hack The Box, TryHackMe" },
        { label: "Excerpt", name: "excerpt", widget: "text" },
        { label: "Published", name: "published", widget: "boolean", default: true },
        { label: "Content", name: "body", widget: "markdown", default: "## Context\n\nWhy I did this. What problem, what challenge, what tool.\n\n## What I did\n\nConcrete steps. Commands, screenshots, config.\n\n```bash\n# commands here\n```\n\n## What I learned\n\nThe takeaway. What surprised me, what I didn't know before.\n\n## Resources\n\n- [Link 1](url)\n- [Link 2](url)" }
      ];

      CMS.init({
        config: {
          backend: {
            name: "github",
            repo: "qyrn/blog",
            branch: "master",
            base_url: "https://blog-wheat-three-44.vercel.app",
            auth_endpoint: "/api/auth"
          },
          media_folder: "public/images/uploads",
          public_folder: "/images/uploads",
          slug: { encoding: "ascii", clean_accents: true },
          collections: [
            {
              name: "posts-fr",
              label: "Articles (FR)",
              folder: "content/posts/fr",
              create: true,
              extension: "mdx",
              format: "frontmatter",
              slug: "{{slug}}",
              fields: fieldsFR
            },
            {
              name: "posts-en",
              label: "Articles (EN)",
              folder: "content/posts/en",
              create: true,
              extension: "mdx",
              format: "frontmatter",
              slug: "{{slug}}",
              fields: fieldsEN
            }
          ]
        }
      });
    </script>
  </body>
</html>
